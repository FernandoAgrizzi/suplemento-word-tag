<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Contratos</title>
    <!-- API Oficial do Office -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <!-- Estilo Externo -->
    <link rel="stylesheet" href="taskpane.css">
</head>
<body>

    <h2>Gerador de Contratos</h2>
    <p>Insira marcas como <code>&lt;&lt;NOME&gt;&gt;</code> no documento e clique abaixo.</p>

    <button id="btnMapear" class="btn-primario">1. Mapear Tags do Documento</button>

    <div id="areaFormulario" style="display: none; margin-top: 12px;">
        <hr class="divisor"/>
        <form id="meuFormulario"></form>
        <button id="btnPreencher" class="btn-sucesso">2. Preencher no Documento Original</button>
        <button id="btnGerarPdf" class="btn-pdf">3. Gerar Novo Documento em PDF</button>
    </div>

    <button id="btnReload" class="btn-recarregar">🔄 Recarregar Painel (Dev)</button>

    <div id="status" class="status"></div>

    <!-- Script Externo -->
    <script src="taskpane.js"></script>
</body>
</html>
